<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login – Bonos CDELU</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1a2a4a">
  <meta name="application-name" content="Bonos CDELU">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bonos CDELU">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/icons/favicon-64.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #1a2a4a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
  </style>
</head>
<body>
  <div class="card p-4" style="width:100%; max-width:380px;">
    <div class="text-center mb-4">
      <i class="bi bi-shield-fill-check text-danger" style="font-size:3rem;"></i>
      <h4 class="mt-2 fw-bold">Bonos Bomberos CDELU</h4>
      <small class="text-muted">Temporada 2026-2027</small>
    </div>
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="post" action="/auth/login">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-danger w-100 mt-2">
        <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
      </button>
    </form>
  </div>
  <script>
    // Registro del Service Worker (PWA)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/service-worker.js", { scope: "/" })
          .catch((err) => console.warn("SW registro falló:", err));
      });
    }
  </script>
</body>
</html>
