<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Bonos CDELU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #1a2a4a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
  </style>
</head>
<body>
  <div class="card p-4" style="width:100%; max-width:380px;">
    <div class="text-center mb-4">
      <i class="bi bi-shield-fill-check text-danger" style="font-size:3rem;"></i>
      <h4 class="mt-2 fw-bold">Bonos Bomberos CDELU</h4>
      <small class="text-muted">Temporada 2026-2027</small>
    </div>
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="post" action="/auth/login">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-danger w-100 mt-2">
        <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
      </button>
    </form>
  </div>
</body>
</html>
