<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login – Bonos CDELU</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1a2a4a">
  <meta name="application-name" content="Bonos CDELU">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bonos CDELU">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/icons/favicon-64.png">
  <script src="/static/js/pwa-install.js?v=20260804a" defer></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/bono.css" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="text-center">
        <div class="login-logo"><i class="bi bi-shield-fill-check text-danger"></i></div>
        <div class="login-title">Bonos Bomberos CDELU</div>
        <div class="login-sub">Temporada 2026-2027</div>
      </div>
      <div class="login-divider"></div>
      {% if error %}
      <div class="alert alert-danger py-2 mb-3 small">
        <i class="bi bi-exclamation-circle-fill me-1"></i>{{ error }}
      </div>
      {% endif %}
      <form method="post" action="/auth/login">
        <div class="login-field mb-3">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" class="form-control" required autofocus autocomplete="username" placeholder="Ingresá tu usuario">
        </div>
        <div class="login-field mb-1">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-login">
          <i class="bi bi-box-arrow-in-right"></i>Ingresar
        </button>
      </form>
    </div>
  </div>
  <script>
    // Registro del Service Worker (PWA)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/service-worker.js", { scope: "/" })
          .catch((err) => console.warn("SW registro falló:", err));
      });
    }
  </script>
</body>
</html>
